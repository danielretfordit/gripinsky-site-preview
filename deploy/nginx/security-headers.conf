# Заголовки безопасности. Подключается в server {} и в каждом location, где есть свой add_header
# (в nginx add_header внутри location отменяет все заголовки уровня server).

# Только HTTPS полгода; preload добавлять после того, как все поддомены точно на HTTPS
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Сайт нельзя встроить в чужой iframe (кликджекинг)
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Камера, микрофон, геолокация и прочие API браузера сайту не нужны
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
# Политика содержимого. Хеши встроенных скриптов Astro кладёт в <meta http-equiv> на каждой странице
# (security.csp в astro.config.mjs); здесь только то, что в meta не работает: запрет встраивания и адрес отчётов.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.getcourse.ru https://auth.robokassa.ru; object-src 'none'; upgrade-insecure-requests" always;
