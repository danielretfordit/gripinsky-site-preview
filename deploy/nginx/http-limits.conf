# Подключается в блоке http {} файла /etc/nginx/nginx.conf:
#   include /var/www/gripinsky/current/deploy/nginx/http-limits.conf;
# Ограничение частоты запросов к API по IP. Основная защита от перебора и спама заявками:
# в приложении есть второе ограничение, но оно живёт в памяти одного процесса и сбрасывается при перезапуске.

# Заявки и оформление: 10 запросов в минуту с IP, всплеск до 5
limit_req_zone $binary_remote_addr zone=gr_api:10m rate=10r/m;
# Админка и прочий динамический трафик: 5 запросов в секунду
limit_req_zone $binary_remote_addr zone=gr_dyn:10m rate=5r/s;
# Не больше 20 одновременных соединений с одного IP
limit_conn_zone $binary_remote_addr zone=gr_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# Версия nginx не раскрывается
server_tokens off;

# Сжатие (brotli подключается отдельным модулем, если он установлен)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;

# Кэш для HTML: каждый раз проверять свежесть; для ассетов с хешем в имени: год
map $sent_http_content_type $gr_cache_control {
  default                   "public, max-age=3600";
  ~text/html                "no-cache";
  ~application/json         "no-cache";
}
