# nginx: боевой сайт gripinsky.ru на VPS.
# Статика из dist/client отдаётся напрямую, /api и /keystatic проксируются в Node (systemd: gripinsky.service).
# Установка: см. deploy/README.md. Пути: /var/www/gripinsky/current -> releases/<sha> (атомарное переключение).

upstream gripinsky_node {
  server 127.0.0.1:4321;
  keepalive 16;
}

# http и www: одна каноническая форма https://gripinsky.ru (как на Tilda)
server {
  listen 80;
  listen [::]:80;
  server_name gripinsky.ru www.gripinsky.ru;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://gripinsky.ru$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.gripinsky.ru;
  ssl_certificate     /etc/letsencrypt/live/gripinsky.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gripinsky.ru/privkey.pem;
  return 301 https://gripinsky.ru$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name gripinsky.ru;

  ssl_certificate     /etc/letsencrypt/live/gripinsky.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gripinsky.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  root /var/www/gripinsky/current/dist/client;
  index index.html;
  charset utf-8;

  include /var/www/gripinsky/current/deploy/nginx/security-headers.conf;
  add_header Cache-Control $gr_cache_control always;

  limit_conn gr_conn 20;
  client_max_body_size 32k;
  client_body_timeout 10s;
  client_header_timeout 10s;

  # Служебные и скрытые файлы не отдаются никогда
  location ~ /\.(?!well-known) { deny all; return 404; }

  # Адреса как на Tilda: без слэша на конце и без .html
  rewrite ^/(.+)/$ /$1 permanent;
  rewrite ^/(.+)/index\.html$ /$1 permanent;
  rewrite ^/index\.html$ / permanent;
  rewrite ^/(.+)\.html$ /$1 permanent;

  # Перенаправления из astro.config.mjs (в статической сборке они meta-refresh, здесь настоящие 301)
  location = /courses-page { return 301 /courses; }

  # Ассеты с хешем в имени: кэш на год
  location /_astro/ {
    include /var/www/gripinsky/current/deploy/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }
  location ~* \.(?:woff2?|avif|webp|jpe?g|png|svg|ico|mp4)$ {
    include /var/www/gripinsky/current/deploy/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    try_files $uri =404;
  }

  # Страницы (build.format: directory)
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  error_page 404 /404.html;

  # API: заявки и оформление. Частота ограничена; тело маленькое
  location /api/ {
    limit_req zone=gr_api burst=5 nodelay;
    limit_except GET POST { deny all; }
    proxy_pass http://gripinsky_node;
    include /var/www/gripinsky/current/deploy/nginx/proxy.conf;
  }

  # Уведомление об оплате Robokassa: подпись проверяет приложение; здесь только адреса Robokassa
  # (актуальный список: https://docs.robokassa.ru, раздел «IP-адреса»). Без ограничения частоты: повторы от Robokassa легальны.
  location = /api/robokassa/result {
    # allow 185.59.216.0/24;   # раскомментировать после сверки адресов в кабинете Robokassa
    # deny all;
    access_log /var/log/nginx/gripinsky-robokassa.log combined;
    proxy_pass http://gripinsky_node;
    include /var/www/gripinsky/current/deploy/nginx/proxy.conf;
  }

  # Проверка живости для выкладки: только с самого сервера
  location = /api/health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://gripinsky_node;
    include /var/www/gripinsky/current/deploy/nginx/proxy.conf;
  }

  # Состояние интеграций для админа (без значений секретов): токен в приложении плюс пароль nginx
  location = /api/admin/status {
    auth_basic "GRIPINSKY admin";
    auth_basic_user_file /etc/nginx/gripinsky-admin.htpasswd;
    proxy_pass http://gripinsky_node;
    include /var/www/gripinsky/current/deploy/nginx/proxy.conf;
  }

  # Админка Keystatic (вход через GitHub). Дополнительно закрыта паролем nginx: файл создаётся командой
  #   htpasswd -c /etc/nginx/gripinsky-admin.htpasswd editor
  location ~ ^/(keystatic|api/keystatic)(/|$) {
    auth_basic "GRIPINSKY admin";
    auth_basic_user_file /etc/nginx/gripinsky-admin.htpasswd;
    limit_req zone=gr_dyn burst=40 nodelay;
    client_max_body_size 20m;   # загрузка картинок работ из админки
    include /var/www/gripinsky/current/deploy/nginx/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://gripinsky_node;
    include /var/www/gripinsky/current/deploy/nginx/proxy.conf;
  }
}
